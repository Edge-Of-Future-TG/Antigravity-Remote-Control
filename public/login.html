<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101010">
    <title>Sign In · Antigravity Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #101010;
            --card: #191919;
            --card-border: #282828;
            --secondary: #242424;
            --foreground: #ececec;
            --muted-foreground: #787878;
            --primary: #007acc;
            --primary-bright: #38bdf8;
            --error: #de5555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)) 20px;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        .brand-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--secondary);
            border: 1px solid var(--card-border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--foreground);
            margin-bottom: 16px;
        }

        .version-pill {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--primary-bright);
            background: rgba(0, 122, 204, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 9999px;
            padding: 2px 10px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        p {
            color: var(--muted-foreground);
            font-size: 13.5px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 46px 0 16px;
            background: var(--secondary);
            border: 1px solid var(--card-border);
            border-radius: 9999px;
            color: var(--foreground);
            font-size: 14.5px;
            outline: none;
            transition: border-color 0.18s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--muted-foreground);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn {
            width: 100%;
            height: 46px;
            border-radius: 9999px;
            border: none;
            background: var(--foreground);
            color: var(--background);
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.12s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(222, 85, 85, 0.14);
            border: 1px solid rgba(222, 85, 85, 0.32);
            color: var(--error);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-avatar">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L3 7l9 5 9-5-9-5z" />
                <path d="M3 12l9 5 9-5" />
                <path d="M3 17l9 5 9-5" />
            </svg>
        </div>
        <div><span class="version-pill">Antigravity Hub 2.33</span></div>
        <h1>Antigravity Remote</h1>
        <p>Enter your session passcode to connect to your desktop Agentic Hub</p>
        <div class="input-group">
            <input type="password" id="password" placeholder="Session passcode" autofocus autocomplete="current-password" aria-label="Session Password">
            <button class="toggle-password" id="togglePasswordBtn" type="button" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
        <button class="submit-btn" id="loginBtn" type="button">Connect to Hub</button>
        <div class="error" id="error">Invalid passcode. Please try again.</div>
    </div>

    <script>
        const btn = document.getElementById('loginBtn');
        const input = document.getElementById('password');
        const error = document.getElementById('error');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.onclick = () => {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        };

        async function doLogin() {
            const password = input.value.trim();
            if (!password) return;

            btn.disabled = true;
            btn.textContent = 'Connecting…';
            error.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    try {
                        localStorage.setItem('ag_session_key', password);
                        if (window.AndroidBridge && typeof window.AndroidBridge.setSessionKey === 'function') {
                            window.AndroidBridge.setSessionKey(password);
                        }
                    } catch (e) {}
                    window.location.href = '/';
                } else {
                    error.textContent = 'Invalid passcode. Please try again.';
                    error.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Connect to Hub';
                }
            } catch (e) {
                error.textContent = 'Connection failed. Ensure Remote Control server is running.';
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Connect to Hub';
            }
        }

        btn.onclick = doLogin;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') doLogin();
        };
    </script>
</body>

</html>
